<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Sequence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#eef3f8; --panel:#ffffff; --text:#1b2a3a; --muted:#5d6f82;
  --c0:#ff6b6b; --c1:#ffc145; --c2:#2fc78a; --c3:#4dabf7;
  --dim:.38;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#101a26; --panel:#182636; --text:#eaf1f8; --muted:#8fa3b8; --dim:.28}
}
:root[data-theme="dark"]{--bg:#101a26; --panel:#182636; --text:#eaf1f8; --muted:#8fa3b8; --dim:.28}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(92vw,420px);text-align:center;padding:16px 0}
h1{font-size:2rem;font-weight:700;margin:0 0 4px;letter-spacing:.01em}
.stats{display:flex;justify-content:center;gap:28px;color:var(--muted);margin-bottom:18px;font-size:1rem}
.stats b{display:block;color:var(--text);font-size:1.6rem;font-weight:700}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--panel);padding:12px;border-radius:32px;aspect-ratio:1}
.pad{border:0;border-radius:22px;cursor:pointer;opacity:var(--dim);transition:opacity .08s,transform .08s;-webkit-tap-highlight-color:transparent}
.pad:nth-child(1){background:var(--c0);border-top-left-radius:110px}
.pad:nth-child(2){background:var(--c1);border-top-right-radius:110px}
.pad:nth-child(3){background:var(--c2);border-bottom-left-radius:110px}
.pad:nth-child(4){background:var(--c3);border-bottom-right-radius:110px}
.pad.lit{opacity:1;transform:scale(.96)}
.pad:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.board.locked .pad{cursor:default}
#msg{min-height:1.6em;margin:18px 0 10px;font-size:1.15rem;font-weight:600}
#go{font:inherit;font-weight:700;font-size:1.1rem;padding:12px 34px;border:0;border-radius:999px;background:var(--text);color:var(--bg);cursor:pointer}
#go:focus-visible{outline:3px solid var(--c3);outline-offset:3px}
.hint{color:var(--muted);font-size:.85rem;margin-top:14px}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Memory Sequence</h1>
  <div class="stats">
    <div><b id="round">0</b>Round</div>
    <div><b id="best">0</b>Best</div>
  </div>
  <div class="board locked" id="board" role="group" aria-label="Game pads">
    <button class="pad" data-i="0" aria-label="Red pad"></button>
    <button class="pad" data-i="1" aria-label="Yellow pad"></button>
    <button class="pad" data-i="2" aria-label="Green pad"></button>
    <button class="pad" data-i="3" aria-label="Blue pad"></button>
  </div>
  <div id="msg" aria-live="polite">Press Start, then repeat the pattern.</div>
  <button id="go">Start</button>
  <div class="hint">Tap the pads, or press Q W A S.</div>
</main>
<script>
(function(){
  var pads=[].slice.call(document.querySelectorAll('.pad'));
  var board=document.getElementById('board'),msg=document.getElementById('msg');
  var roundEl=document.getElementById('round'),bestEl=document.getElementById('best'),go=document.getElementById('go');
  var freqs=[329.6,415.3,523.3,659.3];
  var seq=[],pos=0,accepting=false,best=0,ac=null,timer=null;
  try{best=parseInt(localStorage.getItem('memseq-best')||'0',10)||0}catch(e){}
  bestEl.textContent=best;

  function tone(i,ms,type){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'sine';o.frequency.value=freqs[i];
      g.gain.setValueAtTime(.0001,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+ms/1000);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000+.05);
    }catch(e){}
  }
  function flash(i,ms){
    pads[i].classList.add('lit');tone(i,ms);
    setTimeout(function(){pads[i].classList.remove('lit')},ms);
  }
  function speed(){return Math.max(240,620-seq.length*28)}

  function play(){
    accepting=false;board.classList.add('locked');
    msg.textContent='Watch...';
    var s=speed(),n=0;
    setTimeout(function(){
      timer=setInterval(function(){
        flash(seq[n],s*.7);n++;
        if(n>=seq.length){
          clearInterval(timer);
          setTimeout(function(){accepting=true;pos=0;board.classList.remove('locked');msg.textContent='Your turn'},s);
        }
      },s);
    },600);
  }
  function next(){
    seq.push(Math.floor(Math.random()*4));
    roundEl.textContent=seq.length;
    play();
  }
  function start(){
    clearInterval(timer);seq=[];roundEl.textContent=0;go.textContent='Restart';next();
  }
  function lose(){
    accepting=false;board.classList.add('locked');
    var score=seq.length-1;
    for(var k=0;k<4;k++){(function(k){setTimeout(function(){tone(0,160,'sawtooth')},k*0)})(k)}
    pads.forEach(function(p){p.classList.add('lit')});
    setTimeout(function(){pads.forEach(function(p){p.classList.remove('lit')})},350);
    if(score>best){
      best=score;bestEl.textContent=best;
      try{localStorage.setItem('memseq-best',String(best))}catch(e){}
      msg.textContent='New best: '+score+' rounds. Press Restart to go again.';
    }else{
      msg.textContent='Missed it. You cleared '+score+' round'+(score===1?'':'s')+'.';
    }
    go.textContent='Play again';
  }
  function press(i){
    if(!accepting)return;
    flash(i,200);
    if(i!==seq[pos]){lose();return}
    pos++;
    if(pos===seq.length){
      accepting=false;board.classList.add('locked');
      msg.textContent='Nice!';
      setTimeout(next,700);
    }
  }
  pads.forEach(function(p,i){p.addEventListener('click',function(){press(i)})});
  go.addEventListener('click',start);
  var keys={q:0,w:1,a:2,s:3};
  document.addEventListener('keydown',function(e){
    var k=keys[e.key.toLowerCase()];
    if(k!==undefined&&!e.repeat)press(k);
  });
})();
</script>
</body>
</html>
